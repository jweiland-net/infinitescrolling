categories:
  InfiniteScrolling: ~
  InfiniteScrolling.extensions:
    parent: InfiniteScrolling

settings:
  infinitescrolling.includeJQueryLibrary:
    category: 'InfiniteScrolling'
    type: bool
    default: false
  infinitescrolling.scrollContainer:
    category: 'InfiniteScrolling'
    type: string
    default: 'window'
  infinitescrolling.container:
    category: 'InfiniteScrolling'
    type: string
    default: ''
  infinitescrolling.item:
    category: 'InfiniteScrolling'
    type: string
    default: ''
  infinitescrolling.pagination:
    category: 'InfiniteScrolling'
    type: string
    default: 'ul.f3-widget-paginator'
  infinitescrolling.next:
    category: 'InfiniteScrolling'
    type: string
    default: 'li.next a'
  infinitescrolling.previous:
    category: 'InfiniteScrolling'
    type: string
    default: 'li.previous a'
  infinitescrolling.loader.html:
    category: 'InfiniteScrolling'
    type: string
    default: '<div class="ias-spinner" style="text-align: center;"><img src="{src}"/></div>'
  infinitescrolling.loader.src:
    category: 'InfiniteScrolling'
    type: string
    default: ''
  infinitescrolling.delay:
    category: 'InfiniteScrolling'
    type: int
    default: 0
  infinitescrolling.offset:
    category: 'InfiniteScrolling'
    type: int
    default: 5
  infinitescrolling.negativeMargin:
    category: 'InfiniteScrolling'
    type: int
    default: 200
  infinitescrolling.extension.spinner:
    category: 'InfiniteScrolling.extensions'
    type: bool
    default: true
  infinitescrolling.extension.paging:
    category: 'InfiniteScrolling.extensions'
    type: bool
    default: true
  infinitescrolling.extension.trigger:
    category: 'InfiniteScrolling.extensions'
    type: bool
    default: true
  infinitescrolling.extension.history:
    category: 'InfiniteScrolling.extensions'
    type: bool
    default: true
  infinitescrolling.extension.noneLeft:
    category: 'InfiniteScrolling.extensions'
    type: bool
    default: false
  infinitescrolling.noneLeft.html:
    category: 'InfiniteScrolling.extensions'
    type: string
    default: '<div class="ias-noneleft" style="text-align: center;">{text}</div>'
