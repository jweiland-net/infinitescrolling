name: Tests

on: [pull_request]

jobs:
  testing:
    name: Testing

    runs-on: ubuntu-latest

    strategy:
      fail-fast: true

      matrix:
        php:
          - '8.2'
          - '8.3'
          - '8.4'
          - '8.5'

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v6

      - name: 'Lint PHP'
        run: Build/Scripts/runTests.sh -b docker -p ${{ matrix.php }} -s lint

      - name: 'Install testing system'
        run: Build/Scripts/runTests.sh -b docker -p ${{ matrix.php }} -s composerUpdate

      - name: 'Composer validate'
        run: Build/Scripts/runTests.sh -b docker -p ${{ matrix.php }} -s composerValidate

      - name: 'Composer normalize'
        run: Build/Scripts/runTests.sh -b docker -p ${{ matrix.php }} -s composerNormalize -n

      # Rector runs before CGL: it rewrites code, CGL checks the formatting of the result
      - name: 'Install Rector'
        run: Build/Scripts/runTests.sh -b docker -p ${{ matrix.php }} -s composerUpdateRector

      - name: 'Rector'
        run: Build/Scripts/runTests.sh -b docker -n -p ${{ matrix.php }} -s rector

      - name: 'CGL'
        run: Build/Scripts/runTests.sh -b docker -n -p ${{ matrix.php }} -s cgl

      # Unit and functional tests are not executed yet, because this extension has no tests so far.
      # Copy the corresponding steps, Build/phpunit/ and typo3/testing-framework from EXT:jobboard
      # as soon as tests exist in Tests/Unit or Tests/Functional.
